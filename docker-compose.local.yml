version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: intranet-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-intranet_ti}
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: intranet-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-intranet_ti}
      PORT: 3000
      LANSWEEPER_URL: ${LANSWEEPER_URL}
      LANSWEEPER_USER: ${LANSWEEPER_USER}
      LANSWEEPER_PASS: ${LANSWEEPER_PASS}
      GNEW_USERNAME: ${GNEW_USERNAME}
      GNEW_PASSWORD: ${GNEW_PASSWORD}
      PFSENSE_URL: ${PFSENSE_URL}
      PFSENSE_USER: ${PFSENSE_USER}
      PFSENSE_PASS: ${PFSENSE_PASS}
      PFSENSE_MOCK: ${PFSENSE_MOCK}
      ZABBIX_URL: ${ZABBIX_URL}
      ZABBIX_USER: ${ZABBIX_USER}
      ZABBIX_PASS: ${ZABBIX_PASS}
      NAS_DSM_URL: ${NAS_DSM_URL}
      NAS_DSM_USER: ${NAS_DSM_USER}
      NAS_DSM_PASS: ${NAS_DSM_PASS}
      NAS_SSH_HOST: ${NAS_SSH_HOST}
      NAS_SSH_USER: ${NAS_SSH_USER}
      NAS_SSH_PASS: ${NAS_SSH_PASS}
    depends_on:
      - db
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
      - logs_data:/app/logs

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: intranet-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://intranet-backend:3000
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - uploads_data:/usr/share/nginx/html/uploads

volumes:
  pg_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
